name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'zyprexh'
        required: true
        default: 'zyprexh'
      agent_description:
        description: 'zyprexh'
        required: true
        default: 'zyprexh AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Step 1 - Install -g ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"zyprexh":"${{ github.event.inputs.zyprexh }}","description":"${{ github.event.inputs.zyprexhAIAgent }}"}'
