name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'zyperxh'
        required: true
        default: 'zyprexh'
      agent_description:
        description: 'zyprexh'
        required: true
        default: 'zyprexh AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity
        env:
          # If you have a ClawHub token, add it as repository secret
          # CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Install script dependencies
        working-directory: ./scripts
        run: npm install

      - name: Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js
        working-directory: .

      - name: Generate Verification Link
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge "{\"name\":\"${{ github.event.inputs.zyprexh }}\", \"description\":\"${{ github.event.inputs.zyprexh }}\"}"
        working-directory: .
